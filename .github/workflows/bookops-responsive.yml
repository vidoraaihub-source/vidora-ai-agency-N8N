name: VidoraOps rename patch

on:
  push:
    branches: [bookops-v1-public]
    paths:
      - '.github/workflows/bookops-responsive.yml'

permissions:
  contents: write

jobs:
  rename-product:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bookops-v1-public
      - name: Rename visible product branding
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('bookops-v1/index.html')
          s = p.read_text()
          s = s.replace('BookOps', 'VidoraOps')
          s = s.replace('<div class="logo">B</div>', '<div class="logo">V</div>')
          p.write_text(s)
          PY
      - name: Commit VidoraOps branding
        run: |
          git config user.name "VidoraOps Builder"
          git config user.email "actions@users.noreply.github.com"
          git add bookops-v1/index.html
          git diff --cached --quiet && exit 0
          git commit -m "Rename product to VidoraOps [skip ci]"
          git push origin bookops-v1-public
