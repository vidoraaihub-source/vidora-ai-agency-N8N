name: Deploy BookOps Secure V1

on:
  workflow_dispatch:
  push:
    branches:
      - bookops-secure-v1
    paths:
      - 'bookops-secure/**'
      - '.github/workflows/bookops-secure-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bookops-secure
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: bookops-secure/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply bookops-prod --remote --config wrangler.secure.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Worker
        run: npx wrangler deploy --config wrangler.secure.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
